[package]
name = "worldrailtimetables"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.82"
async-compression = { version = "0.4.9", features = ["gzip", "deflate", "tokio"] }
async-stomp = "0.7.0"
async-trait = "0.1.68"
chrono = { version = "0.4.26", features = ["serde"] }
chrono-tz = { version = "0.8.2", features = ["serde"] }
config-file = "0.2.3"
futures = "0.3.28"
gtfs-structures = "0.49.0"
itertools = "0.12.1"
quick-xml = { version = "0.41.0", features = ["async-tokio", "serialize"] }
rc-zip-tokio = "4.1.0"
reqwest = { version = "0.11.18", features = ["stream"] }
rgb = { version = "0.8.53", features = ["serde"] }
rocket = "0.5.0"
rocket_tera = "2.0.0-rc2"
sea-orm = { version = "2", features = ["chrono", "entity-registry", "runtime-tokio", "schema-sync", "sqlx-sqlite"] }
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.116"
serde_path_to_error = "0.1.20"
tera = "2.4.0"
tokio = { version = "1.28.2", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.8", features = ["compat"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[profile.dev]
opt-level = 3
